<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Peru Roleplay Community</title>
    <link rel="icon" type="image/png" href="./img/logoperurp.png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/mis-datos.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-card {
            background: var(--dark-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--exp-radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .auth-logo {
            width: 100px;
            margin-bottom: 1.5rem;
        }
        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }
        .auth-tab {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 700;
            cursor: pointer;
            padding: 0.5rem;
            transition: color 0.2s;
        }
        .auth-tab.active {
            color: var(--primary-accent);
            border-bottom: 2px solid var(--primary-accent);
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            text-align: left;
        }
        .auth-input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .auth-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: var(--exp-radius-sm);
            padding: 0.85rem;
            color: white;
            outline: none;
        }
        .auth-input:focus {
            border-color: var(--primary-accent);
        }
        .auth-btn {
            background: var(--primary-accent);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: var(--exp-radius-sm);
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
        }
        .auth-btn:hover {
            background: var(--primary-accent-hover);
        }
    </style>
</head>
<body class="exp-page">
    <div class="exp-bg">
        <div class="exp-bg-gradient" style="background: radial-gradient(circle at center, rgba(220, 38, 38, 0.15), transparent 70%);"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <img src="./img/logoperurp.png" alt="Logo" class="auth-logo" onerror="this.src='https://i.imgur.com/3mRhMBw.png'">
            <h2>Bienvenido a Peru RP</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">Ingresa a tu expediente ciudadano</p>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Ingresar</button>
                <button class="auth-tab" onclick="switchTab('register')">Registrarse</button>
            </div>

            <form id="login-form" class="auth-form" onsubmit="handleAuth(event, 'login')">
                <div class="auth-input-group">
                    <label>Nombre de Usuario</label>
                    <input type="text" class="auth-input" id="login-user" required placeholder="Ej: Juan_Perez">
                </div>
                <div class="auth-input-group">
                    <label>Contraseña</label>
                    <input type="password" class="auth-input" id="login-pass" required placeholder="••••••••">
                </div>
                <button type="submit" class="auth-btn">Iniciar Sesión</button>
            </form>

            <form id="register-form" class="auth-form" style="display: none;" onsubmit="handleAuth(event, 'register')">
                <div class="auth-input-group">
                    <label>Nombre Completo</label>
                    <input type="text" class="auth-input" id="reg-name" required placeholder="Ej: Juan Perez">
                </div>
                <div class="auth-input-group">
                    <label>Usuario RP</label>
                    <input type="text" class="auth-input" id="reg-user" required placeholder="Ej: Juan_Perez">
                </div>
                <div class="auth-input-group">
                    <label>Contraseña</label>
                    <input type="password" class="auth-input" id="reg-pass" required placeholder="Crea una contraseña">
                </div>
                <div class="auth-input-group">
                    <label>Código de Invitación</label>
                    <input type="password" class="auth-input" id="reg-token" placeholder="Opcional">
                </div>
                <button type="submit" class="auth-btn">Crear Cuenta</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script type="module" src="./js/backend.js"></script>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            if (event) event.target.classList.add('active');
            
            if (tab === 'login') {
                document.getElementById('login-form').style.display = 'flex';
                document.getElementById('register-form').style.display = 'none';
            } else {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'flex';
            }
        }

        async function handleAuth(e, type) {
            e.preventDefault();
            const Backend = window.Backend; // Cargado desde backend.js
            await Backend.ensureInitialized();
            
            const users = await Backend.getUsers();

            if (type === 'register') {
                const user = document.getElementById('reg-user').value;
                const name = document.getElementById('reg-name').value;
                const pass = document.getElementById('reg-pass').value;
                const token = document.getElementById('reg-token').value;

                // Límite de 2 cuentas por navegador (se salta si usa el token de Owner)
                const existingUserCount = Object.keys(users).length;
                if (existingUserCount >= 1000 && token !== 'PERURPOWNER_') {
                    alert('Límite alcanzado: Solo se permiten 2 cuentas en la base de datos.');
                    return;
                }

                if (users[user]) {
                    alert('El usuario ya existe');
                    return;
                }

                let role = 'unemployed';
                let roles = ['unemployed'];
                
                if (token === 'PERURPOWNER_') {
                    role = 'owner';
                    roles = ['owner', 'admin', 'mod'];
                    alert('¡Acceso especial de Owner concedido!');
                }

                const newUser = { 
                    name, 
                    pass, 
                    balance: 5000, 
                    inventory: [], 
                    role: role,
                    roles: roles,
                    level: 1,
                    id: Math.floor(1000 + Math.random() * 9000)
                };
                await Backend.saveUser(user, newUser);
                alert('Registro exitoso. Bienvenido a Peru RP.');
                switchTab('login');
            } else {
                const user = document.getElementById('login-user').value;
                const pass = document.getElementById('login-pass').value;

                if (users[user] && users[user].pass === pass) {
                    localStorage.setItem('currentUser', user);
                    localStorage.setItem('userName', users[user].name);
                    // Guardar roles en LocalStorage para acceso rápido si es necesario
                    const roles = users[user].roles || [users[user].role || 'unemployed'];
                    localStorage.setItem('userRole', roles[0]); 
                    window.location.href = './index.html';
                } else {
                    alert('Usuario o contraseña incorrectos');
                }
            }
        }
    </script>
</body>
</html>
