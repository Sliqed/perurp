<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergencias 911 | Peru Roleplay Community</title>
    <link rel="icon" type="image/png" href="./img/logoperurp.png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/mis-datos.css">
    <style>
        .emergency-container { max-width: 800px; margin: 3rem auto; }
        .emergency-card { background: var(--dark-surface); border: 1px solid var(--border-color); border-radius: var(--exp-radius); padding: 2.5rem; text-align: center; border-top: 4px solid #ef4444; }
        .emergency-icon { font-size: 5rem; color: #ef4444; margin-bottom: 1rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .emergency-title { font-size: 2.5rem; font-weight: 800; color: white; margin-bottom: 0.5rem; }
        .emergency-desc { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 2.5rem; }
        .emergency-form { display: flex; flex-direction: column; gap: 1.5rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary); font-size: 0.9rem; }
        .form-input, .form-textarea { width: 100%; padding: 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 8px; color: white; outline: none; }
        .form-textarea { height: 120px; resize: none; }
        .send-emergency-btn { padding: 1.2rem; background: #ef4444; color: white; border: none; border-radius: 8px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        .send-emergency-btn:hover { background: #dc2626; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3); }
        .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); text-decoration: none; margin-bottom: 1rem; font-weight: 600; }
        .back-btn:hover { color: var(--primary-accent); }
    </style>
</head>
<body class="exp-page">
    <div class="exp-bg">
        <div class="exp-bg-gradient" style="background: radial-gradient(circle at top right, rgba(220, 38, 38, 0.1), transparent 50%);"></div>
    </div>
    <header class="exp-topbar">
        <div class="exp-topbar-inner container">
            <a class="exp-brand" href="./index.html"><img src="./img/logoperurp.png" alt="Logo"><span>Peru RP Community</span></a>
            <div class="exp-user-pill"><img src="https://i.imgur.com/3mRhMBw.png" alt=""><span id="header-name">Cargando...</span></div>
        </div>
    </header>
    <main class="exp-main"><div class="container">
        <a href="./index.html" class="back-btn"><i class='bx bx-left-arrow-alt'></i> Volver</a>
        
        <div class="emergency-container">
            <div class="emergency-card">
                <div class="emergency-icon"><i class='bx bxs-phone-call'></i></div>
                <h1 class="emergency-title">Centro de Emergencias 911</h1>
                <p class="emergency-desc">Utiliza este formulario solo para reportar emergencias reales que requieran la presencia de la Policía o el SAMU.</p>
                
                <div class="emergency-form">
                    <div class="form-group">
                        <label>Tipo de Emergencia</label>
                        <select class="form-input">
                            <option>Asalto / Robo</option>
                            <option>Accidente de Tránsito</option>
                            <option>Emergencia Médica</option>
                            <option>Incendio</option>
                            <option>Actividad Sospechosa</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ubicación Detallada</label>
                        <input type="text" class="form-input" placeholder="Ej: Calle Junín frente a la Plaza de Armas">
                    </div>
                    <div class="form-group">
                        <label>Descripción de los hechos</label>
                        <textarea class="form-textarea" placeholder="Describe brevemente lo que está ocurriendo..."></textarea>
                    </div>
                    <button class="send-emergency-btn" onclick="send911()">Enviar Reporte al 911</button>
                </div>
            </div>
        </div>
    </div></main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script type="module" src="./js/backend.js"></script>
    <script src="./js/global.js"></script>

    <script>
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) window.location.href = './auth.html';

        async function updateUI() {
            const Backend = window.Backend;
            const users = await Backend.getUsers();
            const data = users[currentUser];
            if (data) {
                document.getElementById('header-name').textContent = data.name;
            }
        }

        window.send911 = async () => {
            const type = document.querySelector('select.form-input').value;
            const location = document.querySelector('input.form-input').value;
            const desc = document.querySelector('textarea.form-textarea').value;

            if (!location || !desc) return alert('Por favor, completa la ubicación y la descripción.');

            const Backend = window.Backend;
            await Backend.ensureInitialized();
            const caller = await Backend.getCurrentUser();

            // Determinar a qué job enviar la solicitud
            let jobId = 'police';
            if (type === 'Emergencia Médica') jobId = 'ems';

            const req = {
                userKey: currentUser,
                userName: caller.name,
                userAvatar: caller.avatarUrl || 'https://i.imgur.com/3mRhMBw.png',
                serviceName: type,
                location: location,
                description: desc,
                price: 0 // Las emergencias suelen ser gratuitas o cobradas luego
            };

            await Backend.sendServiceRequest(jobId, req);

            // Notificar también a los staff (opcional)
            await Backend.sendGlobalAnnouncement('EMERGENCIA 911', `${caller.name} reporta ${type} en ${location}`, 'emergency');

            alert('¡Llamada de emergencia enviada! Las unidades en servicio han recibido tu reporte. Por favor mantente a salvo.');
            window.location.href = './index.html';
        };

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(updateUI, 500);
        });
    </script>
</body>
</html>
