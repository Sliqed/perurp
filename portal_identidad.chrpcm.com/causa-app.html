<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CausaApp | Peru Roleplay Community</title>
    <link rel="icon" type="image/png" href="./img/logoperurp.png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/mis-datos.css">
    <style>
        :root {
            --causa-primary: #dc2626;
            --causa-bg: #0a0a0a;
            --causa-surface: #1a1a1a;
            --sidebar-width: 350px;
        }

        /* Layout base compatible con el portal */
        body {
            overflow-x: hidden;
            background: #000;
        }

        .causa-wrapper {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px); /* Altura dinámica restando header */
            min-height: 500px;
            margin-top: 10px;
        }

        .causa-container {
            flex: 1;
            display: flex;
            background: #111;
            border-radius: 12px;
            border: 1px solid var(--causa-primary);
            overflow: hidden;
            position: relative;
        }

        /* Sidebar Responsiva */
        .causa-sidebar {
            width: var(--sidebar-width);
            background: var(--causa-surface);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #222;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .causa-search { padding: 15px; flex-shrink: 0; border-bottom: 1px solid #222; }
        .causa-search-input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            outline: none;
        }
        .causa-contacts { flex: 1; overflow-y: auto; }

        /* Chat Area Responsiva */
        .causa-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--causa-bg);
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            height: 65px;
            padding: 0 20px;
            background: var(--causa-surface);
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-image: radial-gradient(rgba(220, 38, 38, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* WhatsApp Bubbles */
        .msg {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            position: relative;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-received { background: #262626; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-sent { background: #450a0a; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-img { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 5px; cursor: pointer; display: block; }

        /* Botón de Scroll */
        .scroll-bottom-btn {
            position: absolute;
            right: 20px;
            bottom: 90px;
            width: 40px;
            height: 40px;
            background: var(--causa-primary);
            color: white;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 50;
        }

        /* Input Area */
        .chat-input-area {
            height: 70px;
            padding: 0 15px;
            background: var(--causa-surface);
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #333;
            flex-shrink: 0;
        }
        .causa-input {
            flex: 1;
            padding: 10px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #444;
            border-radius: 25px;
            color: white;
            outline: none;
        }
        .chat-btn { background: none; border: none; color: var(--causa-primary); font-size: 1.5rem; cursor: pointer; }

        /* CONTACTOS */
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #222;
            transition: background 0.2s;
        }
        .contact-item:hover { background: rgba(255,255,255,0.02); }
        .contact-item.active { background: rgba(220, 38, 38, 0.1); border-left: 3px solid var(--causa-primary); }
        .contact-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #333; }
        .contact-info h4 { margin: 0; font-size: 0.95rem; color: #fff; }
        .contact-info span { font-size: 0.8rem; color: #666; }

        /* MOBILE STYLES */
        @media (max-width: 768px) {
            .causa-wrapper { height: calc(100vh - 100px); margin-top: 0; }
            .causa-sidebar {
                position: absolute;
                left: 0; top: 0; bottom: 0;
                width: 100%;
                transform: translateX(0);
            }
            .causa-sidebar.hidden { transform: translateX(-100%); }
            .causa-chat { width: 100%; }
            .mobile-back { display: block !important; }
            .msg { max-width: 90%; }
        }

        .mobile-back { display: none; font-size: 1.5rem; color: var(--causa-primary); cursor: pointer; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="exp-page">
    <header class="exp-topbar">
        <div class="exp-topbar-inner container">
            <a class="exp-brand" href="./index.html"><img src="./img/logoperurp.png" alt="Logo"><span>Peru RP Community</span></a>
            <div class="exp-user-pill"><img src="https://i.imgur.com/3mRhMBw.png" alt=""><span id="header-name">Cargando...</span></div>
        </div>
    </header>

    <main class="exp-main"><div class="container">
        <a href="./index.html" class="back-btn" style="color:#666; text-decoration:none; font-size:0.8rem; display:inline-block; margin-bottom:5px;">
            <i class='bx bx-left-arrow-alt'></i> Volver al Expediente
        </a>
        
        <div class="causa-wrapper">
            <div class="causa-container">
                <!-- Sidebar -->
                <div class="causa-sidebar" id="sidebar">
                    <div class="causa-search">
                        <input type="text" class="causa-search-input" placeholder="Buscar causa..." id="contact-search">
                    </div>
                    <div class="causa-contacts" id="contact-list">
                        <div style="padding: 20px; text-align: center; color: #444;">Cargando...</div>
                    </div>
                </div>

                <!-- Chat -->
                <div class="causa-chat">
                    <div id="chat-window" style="height: 100%; display: flex; flex-direction: column;">
                        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #333; text-align: center; padding: 20px;">
                            <i class='bx bx-message-square-detail' style="font-size: 4rem; margin-bottom: 10px;"></i>
                            <h3>CausaApp</h3>
                            <p>Selecciona un contacto para chatear en tiempo real.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div></main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script type="module" src="./js/backend.js"></script>
    <script src="./js/global.js"></script>

    <script>
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) window.location.href = './auth.html';

        let activeChat = null;
        let allUsers = {};
        let currentUnsubscribe = null;

        async function initApp() {
            const Backend = window.Backend;
            await Backend.ensureInitialized();
            
            allUsers = await Backend.getUsers();
            if (allUsers[currentUser]) {
                document.getElementById('header-name').textContent = allUsers[currentUser].name;
            }
            
            renderContacts('');
        }

        function renderContacts(query) {
            const list = document.getElementById('contact-list');
            const filtered = Object.entries(allUsers).filter(([key, u]) => 
                key !== currentUser && (key.toLowerCase().includes(query.toLowerCase()) || u.name.toLowerCase().includes(query.toLowerCase()))
            );

            if (filtered.length === 0) {
                list.innerHTML = `<div style="padding: 20px; text-align: center; color: #444;">No se encontraron causas</div>`;
                return;
            }

            list.innerHTML = filtered.map(([key, u]) => `
                <div class="contact-item ${activeChat === key ? 'active' : ''}" onclick="selectChat('${key}')">
                    <img src="${u.avatarUrl || 'https://i.imgur.com/3mRhMBw.png'}" class="contact-avatar" onerror="this.src='https://i.imgur.com/3mRhMBw.png'">
                    <div class="contact-info">
                        <h4>${u.name}</h4>
                        <span>@${key}</span>
                    </div>
                </div>
            `).join('');
        }

        async function selectChat(userKey) {
            if (currentUnsubscribe) currentUnsubscribe();

            activeChat = userKey;
            
            // En móvil, ocultar sidebar al elegir chat
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('hidden');
            }

            renderContacts(document.getElementById('contact-search').value);
            
            const user = allUsers[userKey];
            const chatWindow = document.getElementById('chat-window');
            
            chatWindow.innerHTML = `
                <div class="chat-header">
                    <i class='bx bx-left-arrow-alt mobile-back' onclick="showSidebar()"></i>
                    <img src="${user.avatarUrl || 'https://i.imgur.com/3mRhMBw.png'}" class="contact-avatar" style="width: 35px; height: 35px;">
                    <div>
                        <h4 style="color:white; margin:0; font-size: 1rem;">${user.name}</h4>
                        <span style="font-size:0.75rem; color:var(--causa-primary);">En línea</span>
                    </div>
                </div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="scroll-bottom-btn" id="scroll-btn" onclick="scrollToBottom()">
                    <i class='bx bx-chevron-down'></i>
                </div>
                <div class="chat-input-area">
                    <button class="chat-btn" onclick="sendImage()"><i class='bx bx-image-add'></i></button>
                    <input type="text" class="causa-input" id="chat-input" placeholder="Escribe un mensaje...">
                    <button class="chat-btn" onclick="sendMsg()"><i class='bx bxs-send'></i></button>
                </div>
            `;

            const chatMessages = document.getElementById('chat-messages');
            const scrollBtn = document.getElementById('scroll-btn');

            chatMessages.addEventListener('scroll', () => {
                const isBottom = chatMessages.scrollHeight - chatMessages.scrollTop <= chatMessages.clientHeight + 150;
                scrollBtn.style.display = isBottom ? 'none' : 'flex';
            });

            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMsg();
            });

            const Backend = window.Backend;
            currentUnsubscribe = await Backend.onChatChange(currentUser, userKey, (messages) => {
                const container = document.getElementById('chat-messages');
                if (!container) return;
                
                container.innerHTML = messages.map(m => `
                    <div class="msg ${m.sender === currentUser ? 'msg-sent' : 'msg-received'}">
                        ${m.isImage ? `<img src="${m.content}" class="msg-img" onload="autoScroll()" onclick="window.open('${m.content}')">` : m.content}
                        <span style="font-size: 0.65rem; opacity: 0.4; display: block; text-align: right; margin-top: 4px;">
                            ${new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                        </span>
                    </div>
                `).join('');
                autoScroll();
            });
        }

        function showSidebar() {
            document.getElementById('sidebar').classList.remove('hidden');
        }

        function autoScroll() {
            const container = document.getElementById('chat-messages');
            if (container) container.scrollTop = container.scrollHeight;
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-messages');
            if (container) container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }

        async function sendMsg() {
            const input = document.getElementById('chat-input');
            const content = input.value.trim();
            if (!content || !activeChat) return;
            await window.Backend.sendMessage(currentUser, activeChat, content);
            input.value = '';
        }

        async function sendImage() {
            const url = prompt('URL de la imagen:');
            if (url && url.startsWith('http') && activeChat) {
                await window.Backend.sendMessage(currentUser, activeChat, url, true);
            }
        }

        document.getElementById('contact-search').addEventListener('input', (e) => renderContacts(e.target.value));
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
