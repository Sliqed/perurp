<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Owner | Peru Roleplay Community</title>
    <link rel="icon" type="image/png" href="./img/logoperurp.png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/mis-datos.css">
    <style>
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem; }
        .admin-card { background: var(--dark-surface); border: 1px solid var(--border-color); border-radius: var(--exp-radius); padding: 1.5rem; }
        .user-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 1rem; border-bottom: 1px solid var(--border-color);
        }
        .user-info h4 { margin: 0; color: var(--exp-text-bright); }
        .user-info span { font-size: 0.8rem; color: var(--text-secondary); }
        .admin-actions { display: flex; gap: 0.5rem; }
        .admin-btn { 
            padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.05); color: white; cursor: pointer; font-size: 1.1rem;
        }
        .admin-btn:hover { background: var(--primary-accent); border-color: var(--primary-accent); }
        .admin-badge {
            font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: 800;
        }
        .badge-owner { background: #dc2626; color: white; }
        .badge-admin { background: #ef4444; color: white; }
        .badge-mod { background: #991b1b; color: white; }
        .badge-user { background: #64748b; color: white; }
        
        /* Modal Edición */
        .admin-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .edit-card {
            background: var(--dark-surface); border: 1px solid var(--border-color);
            padding: 2rem; border-radius: 12px; width: 100%; max-width: 450px;
        }
        .edit-field { margin-bottom: 1.25rem; }
        .edit-field label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-secondary); }
        .edit-input { 
            width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); 
            border: 1px solid var(--border-color); border-radius: 8px; color: white;
        }
    </style>
</head>
<body class="exp-page">
    <div class="exp-bg">
        <div class="exp-bg-gradient" style="background: radial-gradient(circle at center, rgba(220, 38, 38, 0.1), transparent 70%);"></div>
    </div>
    
    <header class="exp-topbar">
        <div class="exp-topbar-inner container">
            <a class="exp-brand" href="./index.html"><img src="./img/logoperurp.png" alt="Logo"><span>Peru RP Admin</span></a>
            <div class="exp-user-pill">
                <span class="admin-badge badge-owner" style="margin-right: 10px;">OWNER</span>
                <span id="header-name">Admin</span>
            </div>
        </div>
    </header>

    <main class="exp-main"><div class="container">
        <a href="./index.html" class="back-btn"><i class='bx bx-left-arrow-alt'></i> Volver al Portal</a>
        <div class="exp-section-title"><i class='bx bxs-crown'></i> Panel de Control Maestro (Owner)</div>

        <div class="admin-grid">
            <!-- Gestión de Usuarios -->
            <div class="admin-card">
                <h3><i class='bx bx-group'></i> Gestión de Ciudadanos</h3>
                <div id="users-list" style="margin-top: 1rem; max-height: 400px; overflow-y: auto;">
                    <!-- Lista de usuarios -->
                </div>
            </div>

            <!-- Estadísticas y Tiendas -->
            <div class="admin-card">
                <h3><i class='bx bx-stats'></i> Configuración Global</h3>
                <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
                    <div class="exp-notif-item">
                        <div class="bnk-notif-body">
                            <strong>Límite de Cuentas por IP</strong>
                            <p>Actual: 2 cuentas</p>
                        </div>
                        <button class="admin-btn"><i class='bx bx-edit'></i></button>
                    </div>
                    <div class="exp-notif-item">
                        <div class="bnk-notif-body">
                            <strong>Multiplicador de Sueldos</strong>
                            <p>Actual: 1.0x</p>
                        </div>
                        <button class="admin-btn"><i class='bx bx-trending-up'></i></button>
                    </div>
                    <div class="exp-notif-item">
                        <div class="bnk-notif-body">
                            <strong>Stock del Mercado Negro</strong>
                            <p>Actual: Repuesto cada 24h</p>
                        </div>
                        <button class="admin-btn"><i class='bx bx-package'></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div></main>

    <!-- Modal Editar Usuario -->
    <div id="edit-modal" class="admin-modal">
        <div class="edit-card">
            <h3 id="edit-title">Editar Usuario</h3>
            <div style="margin-top: 1.5rem;">
                <input type="hidden" id="edit-user-key">
                <div class="edit-field">
                    <label>Nombre de Rol</label>
                    <input type="text" id="edit-name" class="edit-input">
                </div>
                <div class="edit-field">
                    <label>Dinero en Cuenta ($)</label>
                    <input type="number" id="edit-balance" class="edit-input">
                </div>
                <div class="edit-field">
                    <label>Rango / Permisos</label>
                    <select id="edit-role" class="edit-input">
                        <option value="user">Usuario</option>
                        <option value="mod">Moderador</option>
                        <option value="admin">Administrador</option>
                        <option value="owner">Owner</option>
                    </select>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button class="exp-notif-leer-btn" style="flex: 1;" onclick="closeEdit()">Cancelar</button>
                    <button class="auth-btn" style="flex: 1; margin: 0;" onclick="saveUserChanges()">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script type="module" src="./js/backend.js"></script>

    <script>
        // Verificar rango
        if (localStorage.getItem('userRole') !== 'owner' && localStorage.getItem('userRole') !== 'admin') {
            window.location.href = './index.html';
        }

        async function loadUsers() {
            const Backend = window.Backend;
            const users = await Backend.getUsers();
            const list = document.getElementById('users-list');
            list.innerHTML = '';

            Object.keys(users).forEach(key => {
                const u = users[key];
                const role = u.role || 'user';
                const badgeClass = `badge-${role}`;
                const item = document.createElement('div');
                item.className = 'user-item';
                item.innerHTML = `
                    <div class="user-info">
                        <h4>${u.name} <span class="admin-badge ${badgeClass}">${role}</span></h4>
                        <span>Usuario: ${key} | Balance: $${(u.balance || 0).toLocaleString()}</span>
                    </div>
                    <div class="admin-actions">
                        <button class="admin-btn" onclick="openEdit('${key}')" title="Editar"><i class='bx bx-edit-alt'></i></button>
                        <button class="admin-btn" onclick="deleteUser('${key}')" title="Eliminar" style="color: #ef4444;"><i class='bx bx-trash'></i></button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        async function openEdit(key) {
            const Backend = window.Backend;
            const users = await Backend.getUsers();
            const u = users[key];
            document.getElementById('edit-user-key').value = key;
            document.getElementById('edit-title').textContent = `Editando a: ${key}`;
            document.getElementById('edit-name').value = u.name;
            document.getElementById('edit-balance').value = u.balance;
            document.getElementById('edit-role').value = u.role || 'user';
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeEdit() { document.getElementById('edit-modal').style.display = 'none'; }

        async function saveUserChanges() {
            const key = document.getElementById('edit-user-key').value;
            const Backend = window.Backend;
            const users = await Backend.getUsers();
            
            users[key].name = document.getElementById('edit-name').value;
            users[key].balance = parseInt(document.getElementById('edit-balance').value);
            users[key].role = document.getElementById('edit-role').value;

            await Backend.saveUser(key, users[key]);
            alert('Cambios guardados correctamente.');
            closeEdit();
            loadUsers();
        }

        async function deleteUser(key) {
            if (key === localStorage.getItem('currentUser')) return alert('No puedes eliminarte a ti mismo.');
            if (confirm(`¿Estás seguro de eliminar permanentemente la cuenta de ${key}?`)) {
                const Backend = window.Backend;
                const users = await Backend.getUsers();
                delete users[key];
                
                // Nota: Firebase no tiene un "delete" fácil vía Backend.saveUser si pasamos null,
                // pero por ahora lo manejaremos así o el usuario se quedará en LocalStorage.
                // Idealmente añadiríamos Backend.deleteUser(key)
                
                if (Backend.isFirebaseEnabled) {
                    await Backend.db.ref('rp_users/' + key).remove();
                }
                
                localStorage.setItem('rp_users', JSON.stringify(users));
                loadUsers();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('header-name').textContent = localStorage.getItem('userName');
            setTimeout(loadUsers, 500);
        });
    </script>
</body>
</html>
