<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMU - Centro de Emergencias | Peru Roleplay Community</title>
    <link rel="icon" type="image/png" href="./img/logoperurp.png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/mis-datos.css">
    <style>
        .ems-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-top: 2rem; }
        .ems-card { background: var(--dark-surface); border: 1px solid var(--border-color); border-radius: var(--exp-radius); padding: 2rem; position: relative; }
        .ems-title { font-size: 1.5rem; font-weight: 800; color: white; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.8rem; }
        .ems-title i { color: #dc2626; }
        
        /* Panel de EMS */
        .ems-panel { margin-top: 2rem; }
        .req-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
        .req-card { 
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); 
            padding: 1.5rem; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
            border-left: 5px solid #dc2626;
        }
        .req-user { display: flex; align-items: center; gap: 15px; }
        .req-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #dc2626; }
        .req-details h4 { margin: 0; color: white; font-size: 1.1rem; }
        .req-details p { margin: 5px 0; font-size: 0.9rem; color: #facc15; }
        .req-details span { font-size: 0.8rem; color: var(--text-secondary); }
        
        .req-actions { display: flex; gap: 10px; }
        .btn-action { padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; }
        .btn-accept { background: #dc2626; color: white; }
        .btn-complete { background: #3b82f6; color: white; }
        .btn-reject { background: #64748b; color: white; }

        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
        .status-pending { background: #facc1522; color: #facc15; border: 1px solid #facc1544; }
        .status-accepted { background: #dc262622; color: #dc2626; border: 1px solid #dc262644; }

        .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); text-decoration: none; margin-bottom: 1rem; font-weight: 600; }
        .back-btn:hover { color: var(--primary-accent); }
    </style>
</head>
<body class="exp-page">
    <div class="exp-bg">
        <div class="exp-bg-gradient" style="background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.1), transparent 50%);"></div>
    </div>
    <header class="exp-topbar">
        <div class="exp-topbar-inner container">
            <a class="exp-brand" href="./index.html"><img src="./img/logoperurp.png" alt="Logo"><span>Peru RP Community</span></a>
            <div class="exp-user-pill"><img id="header-avatar" src="https://i.imgur.com/3mRhMBw.png" alt=""><span id="header-name">Cargando...</span></div>
        </div>
    </header>
    <main class="exp-main"><div class="container">
        <a href="./index.html" class="back-btn"><i class='bx bx-left-arrow-alt'></i> Volver</a>
        
        <div class="ems-panel">
            <div class="exp-section-title"><i class='bx bxs-plus-medical'></i> SAMU - Portal Médico de Emergencias</div>
            
            <div class="ems-grid">
                <div class="ems-card">
                    <div class="ems-title"><i class='bx bxs-ambulance'></i> Despachos de Ambulancia (911)</div>
                    <div id="requests-list" class="req-list">
                        <div class="exp-empty">No hay emergencias médicas reportadas.</div>
                    </div>
                </div>
            </div>
        </div>

    </div></main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="./js/global.js"></script>
    <script type="module">
        import Backend from './js/backend.js';

        const currentUserKey = localStorage.getItem('currentUser');
        let userData = null;

        async function init() {
            await Backend.ensureInitialized();
            userData = await Backend.getCurrentUser();
            if (!userData) return window.location.href = './auth.html';

            const roles = userData.roles || [userData.role];
            const isEMS = roles.includes('ems') || roles.includes('owner') || roles.includes('admin');

            if (!isEMS) {
                alert('Acceso denegado: Se requieren credenciales de SAMU.');
                window.location.href = './index.html';
                return;
            }

            document.getElementById('header-name').textContent = userData.name;
            if (userData.avatarUrl) document.getElementById('header-avatar').src = userData.avatarUrl;

            loadEMSRequests();
        }

        async function loadEMSRequests() {
            Backend.onRequestsChange('ems', (requests) => {
                const list = document.getElementById('requests-list');
                const reqArray = Object.values(requests).reverse();

                if (reqArray.length === 0) {
                    list.innerHTML = '<div class="exp-empty">No hay emergencias médicas reportadas.</div>';
                    return;
                }

                list.innerHTML = reqArray.map(r => {
                    const statusClass = `status-${r.status}`;
                    const time = new Date(r.timestamp).toLocaleTimeString();
                    
                    let actionsHtml = '';
                    if (r.status === 'pending') {
                        actionsHtml = `
                            <button class="btn-action btn-accept" onclick="updateStatus('${r.id}', 'accepted')">DESPACHAR UNIDAD</button>
                            <button class="btn-action btn-reject" onclick="updateStatus('${r.id}', 'rejected')">IGNORAR</button>
                        `;
                    } else if (r.status === 'accepted') {
                        actionsHtml = `
                            <button class="btn-action btn-complete" onclick="updateStatus('${r.id}', 'completed')">PACIENTE ESTABILIZADO</button>
                        `;
                    }

                    return `
                        <div class="req-card">
                            <div class="req-user">
                                <img src="${r.userAvatar}" class="req-avatar">
                                <div class="req-details">
                                    <h4>${r.userName} - ${r.serviceName}</h4>
                                    <p>📍 ${r.location || 'Ubicación desconocida'}</p>
                                    <p style="color:var(--text-secondary); font-size:0.8rem;">${r.description || 'Sin descripción'}</p>
                                    <div style="margin-top:8px;"><span class="status-badge ${statusClass}">${r.status}</span> <span style="font-size:0.7rem; color:var(--text-secondary); margin-left:10px;">${time}</span></div>
                                </div>
                            </div>
                            <div class="req-actions">
                                ${actionsHtml}
                            </div>
                        </div>
                    `;
                }).join('');
            });
        }

        window.updateStatus = async (reqId, newStatus) => {
            const roles = userData.roles || [userData.role];
            const isAuthorized = roles.includes('ems') || roles.includes('owner') || roles.includes('admin');

            if (!isAuthorized) {
                alert('Acceso denegado: No tienes el rango médico necesario.');
                return;
            }

            const workerData = {
                key: currentUserKey,
                name: userData.name
            };
            await Backend.updateRequestStatus('ems', reqId, newStatus, workerData);
            if (newStatus === 'completed') {
                alert('Emergencia finalizada con éxito.');
            }
        };

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
