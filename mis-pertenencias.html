<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pertenencias | Peru Roleplay Community</title>
    <link rel="icon" type="image/png" href="./img/logoperurp.png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/mis-datos.css">
    <style>
        .pertenencias-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .item-card { background: var(--dark-surface); border: 1px solid var(--border-color); border-radius: var(--exp-radius); padding: 1.5rem; transition: all 0.2s; }
        .item-card:hover { transform: translateY(-3px); border-color: var(--primary-accent); }
        .item-card h4 { color: white; font-size: 1.25rem; margin-bottom: 0.5rem; font-weight: 800; }
        .item-card p { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.4; }
        .item-icon { font-size: 2.5rem; color: var(--primary-accent); margin-bottom: 1rem; }
        .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); text-decoration: none; margin-bottom: 1rem; font-weight: 600; }
        .back-btn:hover { color: var(--primary-accent); }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 4rem; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px dashed var(--border-color); }
    </style>
</head>
<body class="exp-page">
    <div class="exp-bg" aria-hidden="true">
        <div class="exp-bg-gradient" style="background: radial-gradient(circle at top right, rgba(220, 38, 38, 0.1), transparent 50%);"></div>
    </div>
    <header class="exp-topbar">
        <div class="exp-topbar-inner container">
            <a class="exp-brand" href="./index.html"><img src="./img/logoperurp.png" alt="Logo"><span>Peru RP Community</span></a>
            <div class="exp-user-pill"><img src="https://i.imgur.com/3mRhMBw.png" alt=""><span id="header-name">Cargando...</span></div>
        </div>
    </header>
    <main class="exp-main"><div class="container">
        <a href="./index.html" class="back-btn"><i class='bx bx-left-arrow-alt'></i> Volver</a>
        <div class="exp-section-title"><i class='bx bxs-car-garage'></i> Mis Pertenencias - Inventario Global</div>
        
        <div class="pertenencias-grid" id="pertenencias-list">
            <div class="empty-state">Cargando tus pertenencias...</div>
        </div>
    </div></main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script type="module" src="./js/backend.js"></script>
    <script src="./js/global.js"></script>

    <script>
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) window.location.href = './auth.html';

        async function updateUI() {
            const Backend = window.Backend;
            await Backend.ensureInitialized();
            
            const users = await Backend.getUsers();
            const data = users[currentUser];
            if (!data) return;

            document.getElementById('header-name').textContent = data.name;
            
            const list = document.getElementById('pertenencias-list');
            let html = '';

            // Vehicles
            if (data.vehicles && data.vehicles.length > 0) {
                data.vehicles.forEach(v => {
                    html += `
                        <div class="item-card">
                            <div class="item-icon"><i class='bx bxs-car'></i></div>
                            <h4>${v.model}</h4>
                            <p>Placa: ${v.plate}<br>Estado: Excelente<br>Comprado el: ${v.boughtAt || 'Desconocido'}</p>
                        </div>
                    `;
                });
            }

            // Inventory items
            if (data.inventory && data.inventory.length > 0) {
                data.inventory.forEach(i => {
                    html += `
                        <div class="item-card">
                            <div class="item-icon"><i class='bx bxs-box'></i></div>
                            <h4>${i.name}</h4>
                            <p>Categoría: Objeto<br>Adquirido: ${i.date}</p>
                        </div>
                    `;
                });
            }

            // Static items if empty
            if (!html) {
                html = `
                    <div class="empty-state">
                        <i class='bx bx-ghost' style="font-size: 4rem; color: var(--text-secondary); opacity: 0.5; margin-bottom: 1rem; display: block;"></i>
                        <p style="color: var(--text-secondary);">No tienes propiedades ni vehículos registrados a tu nombre todavía.</p>
                        <a href="./concesionario.html" class="exp-notif-leer-btn" style="display: inline-block; margin-top: 1rem;">Ir al Concesionario</a>
                    </div>
                `;
            }

            list.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateUI();
        });
    </script>
</body>
</html>
