<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robo de Vehículos | Peru Roleplay Community</title>
    <link rel="icon" type="image/png" href="./img/logoperurp.png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/mis-datos.css">
    <style>
        .scrap-container { display: grid; grid-template-columns: 1fr 350px; gap: 1.5rem; margin-top: 2rem; }
        .scrap-card { background: var(--dark-surface); border: 1px solid var(--border-color); border-radius: var(--exp-radius); padding: 2rem; }
        .scrap-title { font-size: 1.5rem; font-weight: 800; color: white; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.8rem; }
        .scrap-title i { color: #ef4444; }
        .scrap-list { display: flex; flex-direction: column; gap: 1rem; }
        .scrap-item { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem; background: rgba(0, 0, 0, 0.3); border-radius: 12px; border-left: 4px solid #ef4444; }
        .scrap-info { display: flex; align-items: center; gap: 1rem; }
        .scrap-icon { font-size: 2rem; color: #ef4444; opacity: 0.7; }
        .scrap-vehicle { display: block; font-weight: 700; color: white; }
        .scrap-reward { display: block; color: #ef4444; font-size: 0.85rem; font-weight: 800; }
        .scrap-btn { padding: 0.7rem 1.5rem; background: #ef4444; color: white; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        .scrap-btn:hover { background: #dc2626; transform: scale(1.05); }
        .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); text-decoration: none; margin-bottom: 1rem; font-weight: 600; }
        .back-btn:hover { color: var(--primary-accent); }
        .scrap-stats { background: rgba(0, 0, 0, 0.2); padding: 1.5rem; border-radius: 12px; margin-top: 1rem; border: 1px solid var(--border-color); }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 0.8rem; font-size: 0.9rem; }
        .stat-label { color: var(--text-secondary); }
        .stat-value { color: white; font-weight: 700; }
    </style>
</head>
<body class="exp-page">
    <div class="exp-bg">
        <div class="exp-bg-gradient" style="background: radial-gradient(circle at top right, rgba(239, 68, 68, 0.05), transparent 50%);"></div>
    </div>
    <header class="exp-topbar">
        <div class="exp-topbar-inner container">
            <a class="exp-brand" href="./index.html"><img src="./img/logoperurp.png" alt="Logo"><span>Peru RP Community</span></a>
            <div class="exp-user-pill"><img src="https://i.imgur.com/3mRhMBw.png" alt=""><span id="header-name">Cargando...</span></div>
        </div>
    </header>
    <main class="exp-main"><div class="container">
        <a href="./index.html" class="back-btn"><i class='bx bx-left-arrow-alt'></i> Volver</a>
        <div class="exp-section-title"><i class='bx bxs-skull'></i> Robo de Vehículos</div>
        
        <div class="scrap-container">
            <div class="scrap-card">
                <div class="scrap-title"><i class='bx bxs-car-garage'></i> Encargos de Exportación</div>
                <div class="scrap-list">
                    <div class="scrap-item">
                        <div class="scrap-info">
                            <i class='bx bxs-car scrap-icon'></i>
                            <div>
                                <span class="scrap-vehicle">Albany Primo</span>
                                <span class="scrap-reward">PAGO: $ 5,500</span>
                            </div>
                        </div>
                        <button class="scrap-btn" onclick="deliverVehicle('Albany Primo')">Entregar</button>
                    </div>
                    <div class="scrap-item">
                        <div class="scrap-info">
                            <i class='bx bxs-car scrap-icon'></i>
                            <div>
                                <span class="scrap-vehicle">Enus Windsor</span>
                                <span class="scrap-reward">PAGO: $ 25,000</span>
                            </div>
                        </div>
                        <button class="scrap-btn" onclick="deliverVehicle('Enus Windsor')">Entregar</button>
                    </div>
                    <div class="scrap-item">
                        <div class="scrap-info">
                            <i class='bx bxs-car scrap-icon'></i>
                            <div>
                                <span class="scrap-vehicle">Bravado Banshee</span>
                                <span class="scrap-reward">PAGO: $ 18,500</span>
                            </div>
                        </div>
                        <button class="scrap-btn" onclick="deliverVehicle('Bravado Banshee')">Entregar</button>
                    </div>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="scrap-card">
                    <div class="scrap-title"><i class='bx bxs-bar-chart-alt-2'></i> Mis Estadísticas</div>
                    <div class="scrap-stats">
                        <div class="stat-row">
                            <span class="stat-label">Vehículos Robados</span>
                            <span class="stat-value">12</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Ganancias Totales</span>
                            <span class="stat-value">$ 124,500</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div></main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script type="module" src="./js/backend.js"></script>
    <script src="./js/global.js"></script>

    <script>
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) window.location.href = './auth.html';

        async function updateUI() {
            const Backend = window.Backend;
            await Backend.ensureInitialized();
            const users = await Backend.getUsers();
            const data = users[currentUser];
            if (data) {
                document.getElementById('header-name').textContent = data.name;
            }
        }

        function deliverVehicle(name) {
            alert(`Has entregado el ${name}. El pago se procesará una vez que el contacto verifique el vehículo.`);
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateUI();
        });
    </script>
</body>
</html>
